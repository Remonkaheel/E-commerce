<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة العروض</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
body { 
    background-color: #f8f9fa; 
    text-align: right;
    direction: rtl;
}
.navbar-brand { font-weight: bold; }
.sidebar { 
    background-color: #343a40; 
    color: white; 
    min-height: 100vh; 
    padding-top: 20px; 
}
.sidebar .nav-link { color: #fff; }
.sidebar .nav-link:hover { background-color: #495057; }
.content { padding: 20px; }
label { 
    font-weight: bold;
    text-align: right;
    display: block;
}
.offer-image {
    max-width: 150px;
    max-height: 100px;
    object-fit: cover;
    border: 2px solid #ddd;
    border-radius: 5px;
}
</style>
</head>
<body>

<div class="d-flex">
<!-- Sidebar -->
<div class="sidebar text-right">
<a class="navbar-brand text-white mx-3" th:href="@{/admin/products}">لوحة التحكم</a>
<div class="list-group list-group-flush mt-4">
	<a th:href="@{/}" class="list-group-item list-group-item-action bg-dark text-white">
	               <i class="fas fa-home"></i> الصفحة الرئيسية
	           </a>
	           <a th:href="@{/admin/products}" class="list-group-item list-group-item-action bg-dark text-white">
	               <i class="fas fa-boxes"></i> إدارة المنتجات
	           </a>
	           <a th:href="@{/admin/offers}" class="list-group-item list-group-item-action bg-dark text-white">
	               <i class="fas fa-gift"></i> إدارة العروض
	           </a>
			   <a th:href="@{/admin/advertisements}" class="list-group-item list-group-item-action bg-dark text-white">
			       <i class="fas fa-ad"></i> إدارة الإعلانات
			   </a>
	           <a th:href="@{/admin/orders}" class="list-group-item list-group-item-action bg-dark text-white">
	               <i class="fas fa-shopping-bag"></i> إدارة الطلبات
	           </a>
	           <a th:href="@{/admin/users}" class="list-group-item list-group-item-action bg-dark text-white active">
	               <i class="fas fa-users"></i> إدارة المستخدمين
	           </a>
	           <a th:href="@{/logout}" class="list-group-item list-group-item-action bg-dark text-white">
	               <i class="fas fa-sign-out-alt"></i> تسجيل خروج
	           </a>
</div>
</div>

<!-- Main Content -->
<div class="content flex-grow-1">
<h2 class="mb-4">إدارة العروض</h2>

<div class="mb-3">
<a th:href="@{/admin/offers/add}" class="btn btn-success">
<i class="fas fa-plus"></i> إضافة عرض جديد
</a>
</div>

<!-- جدول العروض -->
<table class="table table-bordered table-hover">
<thead class="thead-dark">
<tr>
<th>ID</th>
<th>صورة اللابتوب</th>
<th>صورة الموبايل</th>
<th>تاريخ الإضافة</th>
<th>الإجراءات</th>
</tr>
</thead>
<tbody>
<tr th:each="offer : ${offers}">
<td th:text="${offer.id}"></td>
<td>
<!-- ✅ صورة اللابتوب -->
<img th:src="${offer.imageUrlDesktop}" alt="Desktop" class="offer-image">
</td>
<td>
<!-- ✅ صورة الموبايل -->
<img th:src="${offer.imageUrlMobile}" alt="Mobile" class="offer-image">
</td>
<td th:text="${#temporals.format(offer.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
<td>
<a th:href="@{/admin/offers/delete/{id}(id=${offer.id})}" 
   class="btn btn-sm btn-danger"
   onclick="return confirm('هل أنت متأكد من حذف هذا العرض؟')">
<i class="fas fa-trash"></i> حذف
</a>
</td>
</tr>
</tbody>
</table>

<!-- رسالة إذا لم توجد عروض -->
<div th:if="${#lists.isEmpty(offers)}" class="alert alert-info text-center">
لا توجد عروض حالياً. <a th:href="@{/admin/offers/add}">أضف عرضاً جديداً</a>
</div>

</div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

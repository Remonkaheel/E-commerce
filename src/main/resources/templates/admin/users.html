<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة المستخدمين</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
body { 
    background-color: #f8f9fa;
    text-align: right;
    direction: rtl;
}
.sidebar { 
    background-color: #343a40; 
    color: white; 
    min-height: 100vh; 
    padding-top: 20px;
}
.sidebar .nav-link { color: #fff; }
.sidebar .nav-link:hover { background-color: #495057; }
.content { padding: 20px; }

.user-card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: all 0.3s;
}

.user-card:hover {
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.role-badge {
    padding: 5px 12px;
    border-radius: 15px;
    font-size: 12px;
    font-weight: bold;
}

.role-ADMIN { background: #E3F2FD; color: #1976D2; }
.role-USER { background: #F3E5F5; color: #7B1FA2; }
</style>
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar text-right">
        <a class="navbar-brand text-white mx-3" th:href="@{/admin/products}">لوحة التحكم</a>
        <div class="list-group list-group-flush mt-4">
            <a th:href="@{/}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-home"></i> الصفحة الرئيسية
            </a>
            <a th:href="@{/admin/products}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-boxes"></i> إدارة المنتجات
            </a>
            <a th:href="@{/admin/offers}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-gift"></i> إدارة العروض
            </a>
            <a th:href="@{/admin/orders}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-shopping-bag"></i> إدارة الطلبات
            </a>
            <a th:href="@{/admin/users}" class="list-group-item list-group-item-action bg-dark text-white active">
                <i class="fas fa-users"></i> إدارة المستخدمين
            </a>
            <a th:href="@{/logout}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-sign-out-alt"></i> تسجيل خروج
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content flex-grow-1">
        <h2 class="mb-4"><i class="fas fa-users"></i> إدارة المستخدمين</h2>
        
        <div class="mb-3">
            <span class="badge badge-primary">إجمالي المستخدمين: <span th:text="${#lists.size(users)}">0</span></span>
        </div>
        
        <!-- جدول المستخدمين -->
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>ID</th>
                        <th>الاسم</th>
                        <th>البريد الإلكتروني</th>
                        <th>رقم الهاتف</th>
                        <th>الصلاحية</th>
                        <th>عدد الطلبات</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td>
                            <i class="fas fa-user-circle"></i>
                            <strong th:text="${user.username}"></strong>
                        </td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.phone}"></td>
                        <td>
                            <span class="role-badge" th:classappend="'role-' + ${user.role}">
                                <span th:text="${user.role == 'ADMIN' ? 'مدير' : 'مستخدم'}"></span>
                            </span>
                        </td>
                        <td>
                            <span class="badge badge-info" th:text="${user.orders != null ? #lists.size(user.orders) : 0}">0</span>
                        </td>
                        <td>
                            <a th:href="@{'/admin/users/details/' + ${user.id}}" 
                               class="btn btn-sm btn-info" title="عرض التفاصيل">
                                <i class="fas fa-eye"></i>
                            </a>
                            <button type="button" class="btn btn-sm btn-warning" title="تعديل">
                                <i class="fas fa-edit"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

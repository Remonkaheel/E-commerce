<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - المنتجات</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        .sidebar { background-color: #343a40; color: white; min-height: 100vh; padding-top: 20px; }
        .sidebar .nav-link { color: #fff; }
        .sidebar .nav-link:hover { background-color: #495057; }
        .content { padding: 20px; }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar text-right">
        <a class="navbar-brand text-white mx-3" th:href="@{/admin/products}">لوحة التحكم</a>
        <div class="list-group list-group-flush mt-4">
			<a th:href="@{/}" class="list-group-item list-group-item-action bg-dark text-white">
			               <i class="fas fa-home"></i> الصفحة الرئيسية
			           </a>
			           <a th:href="@{/admin/products}" class="list-group-item list-group-item-action bg-dark text-white">
			               <i class="fas fa-boxes"></i> إدارة المنتجات
			           </a>
			           <a th:href="@{/admin/offers}" class="list-group-item list-group-item-action bg-dark text-white">
			               <i class="fas fa-gift"></i> إدارة العروض
			           </a>
					   <a th:href="@{/admin/advertisements}" class="list-group-item list-group-item-action bg-dark text-white">
					       <i class="fas fa-ad"></i> إدارة الإعلانات
					   </a>
			           <a th:href="@{/admin/orders}" class="list-group-item list-group-item-action bg-dark text-white">
			               <i class="fas fa-shopping-bag"></i> إدارة الطلبات
			           </a>
			           <a th:href="@{/admin/users}" class="list-group-item list-group-item-action bg-dark text-white active">
			               <i class="fas fa-users"></i> إدارة المستخدمين
			           </a>
			           <a th:href="@{/logout}" class="list-group-item list-group-item-action bg-dark text-white">
			               <i class="fas fa-sign-out-alt"></i> تسجيل خروج
			           </a> </div>
    </div>

    <!-- Main Content -->
    <div class="content flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>إدارة المنتجات</h1>
            <a th:href="@{/admin/products/add}" class="btn btn-primary"><i class="fas fa-plus"></i> إضافة منتج جديد</a>
			<a th:href="@{/admin/offers/add}" class="btn btn-info"> <i class="fas fa-plus"></i> إضافة عرض </a>
        </div>

        <table class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>#ID</th>
                    <th>اسم المنتج</th>
                    <th>الوصف</th>
                    <th>السعر</th>
                    <th>الكمية</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.description}"></td>
                    <td th:text="${product.price}"></td>
                    <td th:text="${product.stock}"></td>
					<td>
					    <!-- تعديل -->
					    <a th:href="@{'/admin/products/edit/' + ${product.id}}" 
					       class="btn btn-sm btn-warning">
					       <i class="fas fa-edit"></i> تعديل
					    </a>

					    <!-- حذف -->
					    <form th:action="@{'/admin/products/delete/' + ${product.id}}" 
					          method="post" style="display:inline;">
					        <button type="submit" class="btn btn-sm btn-danger"
					                onclick="return confirm('هل أنت متأكد من حذف هذا المنتج؟');">
					            <i class="fas fa-trash-alt"></i> حذف
					        </button>
					    </form>
					</td>


                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

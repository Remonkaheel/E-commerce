<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'منتجات صنف: ' + ${category.name}"> اونر للموازين</title>
	
	<!-- ✅ Favicon -->
	   <link rel="icon" type="image/png" href="/images/logo.jpg">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', 'Arial', sans-serif; 
            background-color: #f0f2f5; 
        }

        /* العنوان */
        .products-header { 
            background: linear-gradient(135deg, #343a40, #007bff); 
            color: white; 
            padding: 50px 0; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .products-header h2 { font-weight: 800; font-size: 36px; }

        /* الكارد */
        .product-card {
            border: none;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 2px;
        }
        .product-card:hover { 
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* الصورة */
        .product-img-container {
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
            border-radius: 15px 15px 0 0;
        }
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* البيانات */
        .product-content {
            padding: 15px 20px 10px 20px;
            text-align: right;
        }
        .product-title { 
            font-size: 16px; 
            font-weight: bold; 
            margin-bottom: 8px;
            color: #333;
        }
        .product-features {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .product-price { 
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .current-price {
            color: #e53935; 
            font-weight: bold;
            font-size: 18px;
        }
        .old-price {
            color: #999;
            text-decoration: line-through;
            font-size: 12px;
        }

        /* البادجات */
        .badge-size {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 10px;
        }
        .badge-out { background: #e53935 !important; }

        /* الأزرار */
        .product-actions {
            padding: 10px 20px 20px 20px;
            display: flex;
            gap: 10px;
        }
        
        /* زر أضف للسلة */
        .btn-add-cart {
            background: #ff6347;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            flex: 1;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-add-cart:hover {
            background: #e5533d;
            transform: scale(1.05);
        }
        
        /* زر اشترى الآن */
        .btn-buy-now {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            flex: 1;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-buy-now:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        /* الموبايل */
        @media (max-width: 768px) {
            .col-6.col-md-6.col-lg-3.mb-4 {
                margin-bottom: 10px !important;
            }
            .row {
                margin-left: -5px;
                margin-right: -5px;
            }
            .row > [class*='col-'] {
                padding-left: 5px;
                padding-right: 5px;
            }
            .products-header { 
                padding: 35px 0; 
            }
            .products-header h2 { 
                font-size: 28px; 
            }
            .product-img-container { 
                height: 180px; 
            }
            .product-content {
                padding: 10px 15px 8px 15px;
            }
            .product-title { 
                font-size: 14px;
                margin-bottom: 5px;
            }
            .product-features { 
                font-size: 12px;
                margin-bottom: 5px;
            }
            .current-price {
                font-size: 15px;
            }
            .old-price {
                font-size: 11px;
            }
            .product-actions {
                padding: 8px 15px 15px 15px;
                gap: 8px;
            }
            .btn-add-cart, .btn-buy-now { 
                font-size: 11px; 
                padding: 10px 12px; 
                border-radius: 50px;
                font-weight: 700;
            }
            .btn-add-cart i, .btn-buy-now i {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header (categories=${categories}, activeCategoryId=${activeCategoryId})}"></div>

<div class="products-header">
    <div class="container">
        <h2 th:text=" ${category.name}">قائمة المنتجات</h2>
    </div>
</div>

<div class="container my-5">
    <div class="row">
        <div class="col-6 col-md-6 col-lg-3 mb-4" th:each="product : ${products}">
            <div class="product-card">
				<a th:href="@{'/product/' + ${product.id}}" style="text-decoration:none; color:inherit;">

                <div class="product-img-container"
                     th:data-image1="${product.imageUrl1}"
                     th:data-image2="${product.imageUrl2}"
                     th:data-image3="${product.imageUrl3}">
                    <div class="badge-size" th:if="${product.stock > 0}">متوفر</div>
                    <div class="badge-size badge-out" th:if="${product.stock == 0}">نفذ</div>
                    <img th:src="@{${product.imageUrl1}}" class="product-img" alt="صورة المنتج" th:if="${product.imageUrl1}">
                </div>
                <div class="product-content">
                    <div class="product-title" th:text="${product.name}">اسم المنتج</div>
                    <div class="product-features" th:text="${product.description}">وصف المنتج</div>
                    <div class="product-price">
                        <span class="old-price" th:if="${product.originalPrice != null}" 
                              th:text="${product.originalPrice}+' ج.م'"></span>
                        <span class="current-price" th:text="${product.price}+' ج.م'"></span>
                    </div>
                </div>
				</a>
                <div class="product-actions">
					<form th:action="@{'/cart/buy/' + ${product.id}}" method="post" style="flex: 1;">
					                       <button type="submit" class="btn-buy-now">
					                           اشترىِ الآن <i class="fas fa-bolt"></i>
					                       </button>
					                   </form>
                    <form th:action="@{'/cart/add/' + ${product.id}}" method="post" style="flex: 1;">
                        <button type="submit" class="btn-add-cart">
                            أضف للسلة <i class="fas fa-shopping-cart"></i>
                        </button>
                    </form>
                   
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
$(document).ready(function() {
    let imageIntervals = {};
    $('.product-card').hover(
        function() {
            let card = $(this);
            let container = card.find('.product-img-container');
            let img = container.find('.product-img');
            let images = [container.data('image1'), container.data('image2'), container.data('image3')].filter(Boolean);
            if (images.length > 1) {
                let currentIndex = 0;
                imageIntervals[card.index()] = setInterval(() => {
                    currentIndex = (currentIndex + 1) % images.length;
                    img.fadeOut(300, () => { img.attr('src', images[currentIndex]); img.fadeIn(300); });
                }, 2500);
            }
        },
        function() {
            let card = $(this);
            let container = card.find('.product-img-container');
            let img = container.find('.product-img');
            clearInterval(imageIntervals[card.index()]);
            if (container.data('image1')) {
                img.fadeOut(300, () => { img.attr('src', container.data('image1')); img.fadeIn(300); });
            }
        }
    );

    $('.btn-add-cart').click(function(e) {
        let btn = $(this);
        let originalHTML = btn.html();
        btn.html('<i class="fas fa-check"></i> تمت الإضافة');
        btn.css('background', '#4CAF50');
        setTimeout(() => {
            btn.html(originalHTML);
            btn.css('background', '#ff6347');
        }, 1500);
    });
});
</script>
</body>
</html>

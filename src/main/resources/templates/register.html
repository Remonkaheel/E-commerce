<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | اونر للموازين</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { font-family: 'Cairo', 'Arial', sans-serif; background-color: #f0f2f5; }
        .card {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
            background: #fff;
        }
        .form-control:focus {
            border-color: #e53935;
            box-shadow: 0 0 0 0.2rem rgba(229, 57, 53, 0.25);
        }
        .btn-dark {
            background-color: #000;
            border-color: #000;
        }
        .btn-dark:hover {
            background-color: #333;
            border-color: #333;
        }
        a { color: #e53935; }
        .input-group-text { background-color: #e9ecef; }
        label {
            text-align: right !important;
            display: block;
            direction: rtl;
        }
		/* ✅ تحسين الموبايل والتابلت */
		@media (max-width: 768px) {
		    .card {
		        max-width: 95%;
		        margin: 20px auto;
		        padding: 15px;
		    }
		    h2 {
		        font-size: 1.3rem;
		    }
		    p.text-muted {
		        font-size: 0.9rem;
		    }
		    .form-control {
		        font-size: 14px;
		        padding: 10px;
		    }
		    .input-group-text {
		        font-size: 14px;
		        padding: 8px 10px;
		    }
		    .btn-dark {
		        font-size: 14px;
		        padding: 10px;
		    }
		    small.form-text {
		        font-size: 12px;
		    }
		}

    </style>
</head>
<body>
    <!-- الهيدر -->
	<div th:replace="~{fragments/header :: header (categories=${categories}, activeCategoryId=${activeCategoryId})}"></div>
	   
    <div class="container">
        <div class="card mt-5">
            <h2 class="text-center mb-4">إنشاء حساب جديد</h2>
            <p class="text-center text-muted">مرحبًا بك في متجر الهندسية للموازين!</p>
            <p class="text-center text-muted">من فضلك املأ النموذج لتصبح عضوًا.</p>

            <!-- رسالة الخطأ -->
            <div th:if="${error}" class="alert alert-danger text-center" role="alert">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label for="name">الاسم</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                        </div>
                        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="ادخل اسمك" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        </div>
                        <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="ادخل بريدك الإلكتروني" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        </div>
                        <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="********" required minlength="6">
                    </div>
                    <small class="form-text text-muted">
                        كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل
                    </small>
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-phone"></i></span>
                        </div>
                        <input type="tel" id="phone" th:field="*{phone}" 
                               class="form-control text-right" 
                               placeholder="ادخل رقم هاتفك" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-dark btn-block mt-4">إنشاء حساب</button>
            </form>

            <div class="text-center mt-3">
                <p class="mb-1">بإنشائك حساب فأنت توافق على</p>
                <p> <a th:href="@{/privacy}">سياسة الخصوصية والأمان</a> &nbsp;  <a th:href="@{/about}">من نحن</a></p>
                <p class="mt-3">لديك حساب بالفعل؟ <a th:href="@{/login}">تسجيل دخول</a></p>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
	<div th:replace="~{fragments/footer :: footer}"></div>

    <!-- سكربتات Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة التسوق | اونر للموازين </title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
body { 
    background-color: #f0f2f5;
    text-align: right;
    direction: rtl;
    font-family: 'Cairo', 'Arial', sans-serif;
}

/* الهيدر */
.cart-header {
    background: linear-gradient(135deg, #343a40, #007bff);
    color: white;
    padding: 50px 0;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.cart-header h2 {
    font-weight: 800;
    font-size: 36px;
}

/* الكونتينر */
.cart-container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 15px;
}

/* كروت المنتجات */
.cart-item-card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    transition: all 0.3s;
}
.cart-item-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}
.cart-item-img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 12px;
}

/* تحكم الكمية */
.quantity-controls {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #f8f9fa;
    border-radius: 25px;
    padding: 6px 12px;
}
.qty-btn {
    background: white;
    border: 1px solid #dee2e6;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
}
.qty-btn:hover {
    background: #e53935;
    color: white;
    border-color: #e53935;
}
.qty-display {
    font-weight: bold;
    font-size: 16px;
    min-width: 28px;
    text-align: center;
}

/* ملخص السلة */
.cart-summary {
    background: white;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    position: sticky;
    top: 20px;
}
.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
}
.summary-total {
    font-size: 22px;
    font-weight: 800;
    color: #e53935;
    padding-top: 15px;
}

/* الأزرار */
.btn-checkout-main {
    background: linear-gradient(135deg, #4CAF50, #45a049);
    color: white;
    padding: 10px;
    border-radius: 30px;
    font-weight: bold;
    font-size: 17px;
    width: 100%;
    border: none;
    margin-top: 15px;
    transition: all 0.3s;
}
.btn-checkout-main:hover {
    background: linear-gradient(135deg, #45a049, #3d8b40);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
    color: white;
}
.btn-continue {
    background: white;
    border: 2px solid #333;
    color: #333;
    padding: 7px;
    border-radius: 30px;
    font-weight: bold;
    width: 100%;
    margin-top: 10px;
    transition: all 0.3s;
}
.btn-continue:hover {
    background: #333;
    color: white;
}
.btn-remove {
    background: white;
    border: 1px solid #dc3545;
    color: #dc3545;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    transition: all 0.3s;
}
.btn-remove:hover {
    background: #dc3545;
    color: white;
}

/* السلة الفارغة */
.empty-cart {
    text-align: center;
    padding: 80px 20px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}
.empty-cart i {
    font-size: 80px;
    color: #ccc;
    margin-bottom: 20px;
}

/* موبايل */
@media (max-width: 767px) {
    .cart-header { padding: 35px 0; }
    .cart-header h2 { font-size: 26px; }
    .cart-item-img { width: 80px; height: 80px; }
    .btn-checkout-main, .btn-continue { font-size: 15px; padding: 7px; }
}
</style>
</head>
<body>

<div th:replace="~{fragments/header :: header (categories=${categories}, activeCategoryId=${activeCategoryId})}"></div>

<div class="cart-header">
    <div class="container">
        <h2><i class="fas fa-shopping-cart"></i> سلة التسوق</h2>
    </div>
</div>

<div class="cart-container">
    <!-- لو السلة فاضية -->
    <div th:if="${#lists.isEmpty(items)}" class="empty-cart">
        <i class="fas fa-shopping-bag"></i>
        <h3>سلة التسوق فارغة</h3>
        <p class="text-muted">لم تضف أي منتجات بعد</p>
        <a th:href="@{/category/1}" class="btn btn-dark btn-lg rounded-pill mt-3 px-5">
            <i class="fas fa-store"></i> ابدأ التسوق
        </a>
    </div>

    <!-- لو في منتجات -->
    <div th:unless="${#lists.isEmpty(items)}" class="row">
        <div class="col-lg-8">
            <div class="cart-item-card" th:each="item : ${items}">
                <div class="row align-items-center">
                    <div class="col-4 col-md-2">
                        <img th:src="@{${item.imageUrl}}" class="cart-item-img" alt="product">
                    </div>
                    <div class="col-8 col-md-4">
                        <h5 th:text="${item.name}">اسم المنتج</h5>
                        <p class="text-muted mb-0">متوفر في المخزون</p>
                    </div>
                    <div class="col-6 col-md-2 mt-3 mt-md-0">
                        <div style="font-size: 18px; font-weight: bold; color: #e53935;">
                            <span th:text="${item.price} + ' ج.م'">0 ج.م</span>
                        </div>
                    </div>
                    <div class="col-6 col-md-2">
                        <div class="quantity-controls">
                            <form th:action="@{'/cart/decrease/' + ${item.productId}}" method="post" style="display:inline;">
                                <button type="submit" class="qty-btn"><i class="fas fa-minus"></i></button>
                            </form>
                            <span class="qty-display" th:text="${item.quantity}">1</span>
                            <form th:action="@{'/cart/increase/' + ${item.productId}}" method="post" style="display:inline;">
                                <button type="submit" class="qty-btn"><i class="fas fa-plus"></i></button>
                            </form>
                        </div>
                    </div>
                    <div class="col-12 col-md-2 text-center mt-3 mt-md-0">
                        <form th:action="@{'/cart/remove/' + ${item.productId}}" method="post">
                            <button type="submit" class="btn-remove">
                                <i class="fas fa-trash"></i> حذف
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4 mt-4 mt-lg-0">
            <div class="cart-summary">
                <h4 class="mb-4">ملخص الطلب</h4>
                <div class="summary-row">
                    <span>عدد المنتجات:</span>
                    <strong th:text="${#lists.size(items)}">0</strong>
                </div>
                <div class="summary-row">
                    <span>المجموع الفرعي:</span>
                    <strong th:text="${total} + ' ج.م'">0 ج.م</strong>
                </div>
                <div class="summary-row">
                    <span>الشحن:</span>
                    <strong class="text-success">يحتسب لاحقا</strong>
                </div>
                <div class="summary-row summary-total">
                    <span>الإجمالي:</span>
                    <span th:text="${total} + ' ج.م'">0 ج.م</span>
                </div>
                <a th:href="@{/cart/checkout}" class="btn-checkout-main">
                    <i class="fas fa-credit-card"></i> الدفع والتوصيل
                </a>
                <a th:href="@{/category/1}" class="btn-continue">
                    <i class="fas fa-arrow-right"></i> متابعة التسوق
                </a>
                <form th:action="@{/cart/clear}" method="post" class="mt-3">
                    <button type="submit" class="btn btn-outline-danger btn-block" 
                            onclick="return confirm('هل أنت متأكد من تفريغ السلة؟')">
                        <i class="fas fa-trash-alt"></i> تفريغ السلة
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

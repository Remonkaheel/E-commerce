<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل المنتج</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { 
            background-color: #f8f9fa;
            text-align: right;
            direction: rtl;
        }
        .sidebar { 
            background-color: #343a40; 
            color: white; 
            min-height: 100vh; 
            padding-top: 20px;
        }
        .sidebar .nav-link { color: #fff; }
        .sidebar .nav-link:hover { background-color: #495057; }
        .content { padding: 20px; }
        .form-container { 
            max-width: 800px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
        }
        label {
            font-weight: bold;
            text-align: right;
            display: block;
        }
        .image-preview {
            max-width: 150px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
		/* ============================= */
		/* Category Management Styles    */
		/* ============================= */
		.category-item {
		    display: flex;
		    align-items: center;
		    justify-content: space-between;
		    padding: 8px 12px;
		    background: #f8f9fa;
		    border-radius: 8px;
		    margin-bottom: 8px;
		    transition: all 0.3s;
		}

		.category-item:hover {
		    background: #e9ecef;
		    transform: translateX(-3px);
		}

		.category-name {
		    flex: 1;
		    font-weight: 600;
		    color: #333;
		}

		.btn-delete-category {
		    background: none;
		    border: none;
		    color: #e53935;
		    cursor: pointer;
		    padding: 5px 10px;
		    border-radius: 5px;
		    transition: all 0.3s;
		    font-size: 16px;
		}

		.btn-delete-category:hover {
		    background: #ffebee;
		    transform: scale(1.1);
		}

		/* ===== Modal Styles ===== */
		.modal-content {
		    border-radius: 15px;
		    border: none;
		    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
		}

		.modal-header {
		    background: linear-gradient(135deg, #e53935, #c62828);
		    color: white;
		    border-radius: 15px 15px 0 0;
		    padding: 20px;
		}

		.modal-header .close {
		    color: white;
		    opacity: 1;
		}

		.modal-body {
		    padding: 30px;
		    text-align: center;
		}

		.modal-icon {
		    font-size: 60px;
		    color: #e53935;
		    margin-bottom: 20px;
		}

		.modal-message {
		    font-size: 18px;
		    color: #333;
		    margin-bottom: 10px;
		    font-weight: 600;
		}

		.modal-warning {
		    font-size: 14px;
		    color: #666;
		    margin-bottom: 20px;
		}

		.btn-confirm-delete {
		    background: linear-gradient(135deg, #e53935, #c62828);
		    color: white;
		    border: none;
		    padding: 12px 30px;
		    border-radius: 50px;
		    font-weight: bold;
		    transition: all 0.3s;
		}

		.btn-confirm-delete:hover {
		    transform: translateY(-2px);
		    box-shadow: 0 5px 15px rgba(229, 57, 53, 0.3);
		}

		.btn-cancel {
		    background: #6c757d;
		    color: white;
		    border: none;
		    padding: 12px 30px;
		    border-radius: 50px;
		    font-weight: bold;
		}

		.categories-list-header {
		    display: flex;
		    align-items: center;
		    justify-content: space-between;
		    margin-bottom: 15px;
		    padding-bottom: 10px;
		    border-bottom: 2px solid #dee2e6;
		}

		.category-count {
		    background: #e53935;
		    color: white;
		    padding: 3px 10px;
		    border-radius: 50px;
		    font-size: 12px;
		    font-weight: bold;
		}

    </style>
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar text-right">
        <a class="navbar-brand text-white mx-3" th:href="@{/admin/products}">لوحة التحكم</a>
        <div class="list-group list-group-flush mt-4">
            <a th:href="@{/}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-home"></i> الصفحة الرئيسية
            </a>
            <a th:href="@{/admin/products}" class="list-group-item list-group-item-action bg-dark text-white active">
                <i class="fas fa-boxes"></i> إدارة المنتجات
            </a>
            <a th:href="@{/admin/offers}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-gift"></i> إدارة العروض
            </a>
			<a th:href="@{/admin/advertisements}" class="list-group-item list-group-item-action bg-dark text-white">
			    <i class="fas fa-ad"></i> إدارة الإعلانات
			</a>
            <a th:href="@{/admin/orders}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-shopping-bag"></i> إدارة الطلبات
            </a>
            <a th:href="@{/admin/users}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-users"></i> إدارة المستخدمين
            </a>
            <a th:href="@{/logout}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-sign-out-alt"></i> تسجيل خروج
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content flex-grow-1">
        <div class="form-container">
            <h2 class="mb-4 text-center">✏️ تعديل المنتج</h2>
            
            <form th:action="@{'/admin/products/update/' + ${product.id}}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="name">اسم المنتج</label>
                    <input type="text" id="name" name="name" class="form-control" th:value="${product.name}" required>
                </div>
                
                <div class="form-group">
                    <label for="description">الوصف</label>
                    <textarea id="description" name="description" class="form-control" rows="3" required th:text="${product.description}"></textarea>
                </div>
				<div class="form-group">
				                   <label for="detailedDescription">الوصف التفصيلى</label>
				                   <textarea id="detailedDescription" name="detailedDescription" class="form-control" rows="10" required th:text="${product.detailedDescription}"></textarea>
				               </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="price">السعر (بعد الخصم)</label>
                            <input type="number" id="price" name="price" class="form-control" step="0.01" th:value="${product.price}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="stock">الكمية</label>
                            <input type="number" id="stock" name="stock" class="form-control" th:value="${product.stock}" required>
                        </div>
                    </div>
                </div>
                
				<!-- ===== قسم الأصناف المحسّن ===== -->
				                <div class="form-group">
				                    <div class="categories-list-header">
				                        <h6><i class="fas fa-layer-group"></i> الأصناف المتاحة</h6>
				                        <span class="category-count" th:text="${categories.size()} + ' صنف'">0 صنف</span>
				                    </div>
				                    
				                    <!-- قائمة الأصناف مع زر الحذف -->
				                    <div class="categories-list mb-3" style="max-height: 200px; overflow-y: auto;">
				                        <div class="category-item" th:each="category : ${categories}">
				                            <span class="category-name" th:text="${category.name}">اسم الصنف</span>
				                            <button type="button" 
				                                    class="btn-delete-category" 
				                                    th:attr="data-category-id=${category.id}, data-category-name=${category.name}"
				                                    onclick="confirmDelete(this)">
				                                <i class="fas fa-times"></i>
				                            </button>
				                        </div>
				                    </div>

				                    <label>اختر الصنف</label>
				                    <select id="category" name="categoryId" class="form-control" required>
				                        <option value="">اختر صنف</option>
				                        <option th:each="category : ${categories}" 
				                                th:value="${category.id}" 
				                                th:text="${category.name}"></option>
				                        <option value="new">➕ أضف صنف جديد</option>
				                    </select>
				                </div>

				                <div class="form-group new-category-input" style="display: none;">
				                    <label>اسم الصنف الجديد</label>
				                    <input type="text" id="newCategoryName" name="newCategoryName" class="form-control">
				                </div>

                
                <!-- الصور الحالية -->
                <div class="form-group">
                    <label>الصور الحالية</label>
                    <div class="d-flex gap-3">
                        <div th:if="${product.imageUrl1}">
                            <img th:src="@{${product.imageUrl1}}" alt="صورة 1" class="image-preview">
                            <p class="text-center"><small>صورة 1</small></p>
                        </div>
                        <div th:if="${product.imageUrl2}">
                            <img th:src="@{${product.imageUrl2}}" alt="صورة 2" class="image-preview">
                            <p class="text-center"><small>صورة 2</small></p>
                        </div>
                        <div th:if="${product.imageUrl3}">
                            <img th:src="@{${product.imageUrl3}}" alt="صورة 3" class="image-preview">
                            <p class="text-center"><small>صورة 3</small></p>
                        </div>
                    </div>
                </div>
                
                <!-- رفع صور جديدة -->
                <div class="form-group">
                    <label for="file1">تغيير الصورة 1 (اختياري)</label>
                    <input type="file" id="file1" name="file1" class="form-control-file">
                </div>
                
                <div class="form-group">
                    <label for="file2">تغيير الصورة 2 (اختياري)</label>
                    <input type="file" id="file2" name="file2" class="form-control-file">
                </div>
                
                <div class="form-group">
                    <label for="file3">تغيير الصورة 3 (اختياري)</label>
                    <input type="file" id="file3" name="file3" class="form-control-file">
                </div>
                
                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="fas fa-save"></i> حفظ التعديلات
                    </button>
                    <a th:href="@{/admin/products}" class="btn btn-secondary btn-lg">
                        <i class="fas fa-arrow-right"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ===== Modal تأكيد الحذف ===== -->
<div class="modal fade" id="deleteModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-exclamation-triangle"></i> تأكيد الحذف
                </h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-icon">
                    <i class="fas fa-trash-alt"></i>
                </div>
                <div class="modal-message">
                    هل أنت متأكد من حذف الصنف؟
                </div>
                <div class="modal-warning" id="categoryNameDisplay">
                    <!-- اسم الصنف يظهر هنا -->
                </div>
                <p style="color: #e53935; font-size: 13px;">
                    <i class="fas fa-info-circle"></i> 
                    سيتم حذف الصنف نهائياً ولا يمكن التراجع عن هذا الإجراء
                </p>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn-cancel" data-dismiss="modal">
                    <i class="fas fa-times"></i> إلغاء
                </button>
                <button type="button" class="btn-confirm-delete" onclick="deleteCategory()">
                    <i class="fas fa-check"></i> نعم، احذف
                </button>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
// إظهار/إخفاء حقل الصنف الجديد
document.getElementById('category').addEventListener('change', function() {
    const newCategoryInput = document.querySelector('.new-category-input');
    newCategoryInput.style.display = (this.value === 'new') ? 'block' : 'none';
});

// معاينة السعر
document.getElementById('price').addEventListener('input', function() {
    const discounted = parseFloat(this.value);
    const preview = document.getElementById('pricePreview');
    if (discounted > 0) {
        const original = discounted / 0.8;
        document.getElementById('originalPriceDisplay').textContent = original.toFixed(2) + ' ج.م';
        document.getElementById('finalPriceDisplay').textContent = discounted.toFixed(2) + ' ج.م';
        preview.style.display = 'block';
    } else {
        preview.style.display = 'none';
    }
});

// متغيرات لتخزين بيانات الصنف المراد حذفه
let categoryToDelete = {
    id: null,
    name: ''
};

// إظهار Modal التأكيد
function confirmDelete(button) {
    categoryToDelete.id = button.getAttribute('data-category-id');
    categoryToDelete.name = button.getAttribute('data-category-name');
    
    document.getElementById('categoryNameDisplay').innerHTML = 
        '<strong style="color: #e53935; font-size: 16px;">' + categoryToDelete.name + '</strong>';
    
    $('#deleteModal').modal('show');
}

// حذف الصنف
function deleteCategory() {
    if (!categoryToDelete.id) return;

    // إرسال طلب الحذف
    fetch('/admin/categories/' + categoryToDelete.id, {
        method: 'DELETE',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => {
        if (response.ok) {
            // إخفاء Modal
            $('#deleteModal').modal('hide');
            
            // إزالة الصنف من القائمة بتأثير سلس
            const categoryItems = document.querySelectorAll('.category-item');
            categoryItems.forEach(item => {
                const deleteBtn = item.querySelector('.btn-delete-category');
                if (deleteBtn && deleteBtn.getAttribute('data-category-id') == categoryToDelete.id) {
                    item.style.transition = 'all 0.3s ease';
                    item.style.opacity = '0';
                    item.style.transform = 'translateX(50px)';
                    
                    setTimeout(() => {
                        item.remove();
                        
                        // تحديث عداد الأصناف
                        const remainingCategories = document.querySelectorAll('.category-item').length;
                        document.querySelector('.category-count').textContent = remainingCategories + ' صنف';
                        
                        // إزالة من القائمة المنسدلة
                        const selectOption = document.querySelector(`#category option[value="${categoryToDelete.id}"]`);
                        if (selectOption) {
                            selectOption.remove();
                        }
                        
                        // رسالة نجاح
                        showSuccessMessage('تم حذف الصنف بنجاح! ✅');
                    }, 300);
                }
            });
        } else {
            showErrorMessage('حدث خطأ أثناء الحذف! ❌');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showErrorMessage('فشل الاتصال بالخادم! ❌');
    });
}

// رسائل النجاح والخطأ
function showSuccessMessage(message) {
    const alert = document.createElement('div');
    alert.className = 'alert alert-success alert-dismissible fade show';
    alert.style.cssText = 'position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; min-width: 300px;';
    alert.innerHTML = `
        <strong>${message}</strong>
        <button type="button" class="close" data-dismiss="alert">&times;</button>
    `;
    document.body.appendChild(alert);
    
    setTimeout(() => {
        alert.remove();
    }, 3000);
}

function showErrorMessage(message) {
    const alert = document.createElement('div');
    alert.className = 'alert alert-danger alert-dismissible fade show';
    alert.style.cssText = 'position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; min-width: 300px;';
    alert.innerHTML = `
        <strong>${message}</strong>
        <button type="button" class="close" data-dismiss="alert">&times;</button>
    `;
    document.body.appendChild(alert);
    
    setTimeout(() => {
        alert.remove();
    }, 3000);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة عرض جديد</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        .sidebar { background-color: #343a40; color: white; min-height: 100vh; padding-top: 20px; }
        .sidebar .nav-link { color: #fff; }
        .sidebar .nav-link:hover { background-color: #495057; }
        .content { padding: 20px; }
        label { font-weight: bold; }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar text-right">
        <a class="navbar-brand text-white mx-3" th:href="@{/admin/products}">لوحة التحكم</a>
        <div class="list-group list-group-flush mt-4">
            <a th:href="@{/}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-home"></i> الصفحة الرئيسية
            </a>
            <a th:href="@{/admin/products}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-boxes"></i> إدارة المنتجات
            </a>
            <a th:href="@{/admin/offers}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-gift"></i> إدارة العروض
            </a>
			<a th:href="@{/admin/advertisements}" class="list-group-item list-group-item-action bg-dark text-white">
			    <i class="fas fa-ad"></i> إدارة الإعلانات
			</a>
            <a href="#" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-list-alt"></i> إدارة الطلبات
            </a>
            <a href="#" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-users-cog"></i> إدارة المستخدمين
            </a>
            <a th:href="@{/logout}" class="list-group-item list-group-item-action bg-dark text-white">
                <i class="fas fa-sign-out-alt"></i> تسجيل خروج
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content flex-grow-1">
        <h2 class="mb-4">إضافة عرض جديد</h2>
        <form th:action="@{/admin/offers/add}" method="post" enctype="multipart/form-data">

            <!-- صورة اللابتوب -->
			<!-- صورة اللابتوب -->
			<div class="form-group">
			<label for="fileDesktop" class="text-right d-block">📷 صورة العرض (لابتوب)</label>
			<input type="file" id="fileDesktop" name="fileDesktop" class="form-control-file" required>
			</div>

			<!-- صورة الموبايل -->
			<div class="form-group mt-3">
			<label for="fileMobile" class="text-right d-block">📱 صورة العرض (موبايل)</label>
			<input type="file" id="fileMobile" name="fileMobile" class="form-control-file" required>
			</div>

            <div class="mt-4">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> حفظ
                </button>
                <a th:href="@{/admin/offers}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> إلغاء
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>

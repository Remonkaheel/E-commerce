<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> تم الطلب بنجاح | اونر للموازين</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cairo', 'Arial', sans-serif;
    padding: 20px;
}

.success-container {
    background: white;
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    max-width: 650px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    animation: slideIn 0.6s ease-out;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

.success-icon {
    width: 110px;
    height: 110px;
    background: linear-gradient(135deg, #4CAF50, #45a049);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 25px;
    animation: scaleIn 0.5s ease-out;
}
.success-icon i {
    color: white;
    font-size: 55px;
}
@keyframes scaleIn {
    0% { transform: scale(0); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

h1 {
    color: #333;
    font-weight: 800;
    margin-bottom: 10px;
    font-size: 28px;
}

.order-number {
    background: #f8f9fa;
    padding: 15px;
    border-radius: 12px;
    margin: 20px 0;
    font-size: 18px;
    font-weight: 600;
}
.order-number strong {
    color: #667eea;
    font-size: 24px;
}

.btn-container {
    margin-top: 25px;
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.btn-custom {
    padding: 12px 28px;
    border-radius: 30px;
    font-weight: bold;
    text-decoration: none;
    transition: all 0.3s;
    display: inline-block;
    font-size: 15px;
}
.btn-primary-custom {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
}
.btn-primary-custom:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102,126,234,0.4);
    color: white;
    text-decoration: none;
}
.btn-secondary-custom {
    background: white;
    color: #667eea;
    border: 2px solid #667eea;
}
.btn-secondary-custom:hover {
    background: #667eea;
    color: white;
    text-decoration: none;
}

.info-box {
    background: #E8F5E9;
    border-left: 5px solid #4CAF50;
    padding: 15px;
    border-radius: 10px;
    margin: 20px 0;
    text-align: right;
    font-size: 15px;
}
.info-box i {
    color: #4CAF50;
    margin-left: 8px;
}

/* موبايل */
@media (max-width: 767px) {
    h1 { font-size: 22px; }
    .order-number strong { font-size: 20px; }
    .btn-custom { font-size: 14px; padding: 10px 20px; }
    .success-icon { width: 90px; height: 90px; }
    .success-icon i { font-size: 40px; }
}
</style>
</head>
<body>

<div class="success-container">
    <div class="success-icon">
        <i class="fas fa-check"></i>
    </div>

    <h1>تم إتمام طلبك بنجاح!</h1>
    <p style="font-size: 16px; color: #666;">شكراً لك على ثقتك بنا</p>

    <div class="order-number">
        <div style="color: #666; margin-bottom: 5px;">رقم الطلب</div>
        <strong th:text="'#' + ${order.id}">#12345</strong>
    </div>

    <div class="info-box">
        <p style="margin: 0;">
            <i class="fas fa-info-circle"></i>
            <strong>سوف نتواصل معك قريباً</strong> لتأكيد الطلب وترتيب التوصيل
        </p>
    </div>

    <p style="color: #999; font-size: 14px;">
        <i class="fas fa-clock"></i>
        تم إنشاء الطلب في:
        <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy - HH:mm')}">05/10/2025</span>
    </p>

    <div class="btn-container">
        <a th:href="@{/orders}" class="btn-custom btn-primary-custom">
            <i class="fas fa-list"></i> عرض طلباتي
        </a>
        <a th:href="@{/}" class="btn-custom btn-secondary-custom">
            <i class="fas fa-home"></i> الصفحة الرئيسية
        </a>
    </div>
</div>

</body>
</html>
